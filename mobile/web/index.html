<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MorFin — Neo-Flat Personal Finance Tracker">
  <meta name="theme-color" content="#121614">
  <meta name="google-signin-client_id" content="669965320780-k4a7kv6m2080a3br9lsna91rcvgoo0bt.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="morfin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MorFin — Finance Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121614;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #morfin-preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 48%, #191F1C 0%, #121614 58%, #0C0F0E 100%);
      transition: opacity 0.25s ease-out;
    }

    #morfin-preloader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .boot-dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .boot-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #C9F73B;
      opacity: 0.35;
      animation: dotPulse 1.05s infinite ease-in-out;
    }

    .boot-dots span:nth-child(2) { animation-delay: 0.16s; }
    .boot-dots span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes dotPulse {
      0%, 80%, 100% { transform: scale(0.78); opacity: 0.3; }
      40% { transform: scale(1.18); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="morfin-preloader" aria-label="Memuat MorFin">
    <div class="boot-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('morfin-preloader');
      if (el) {
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 280);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
